<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js — Solstice Ocean</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
canvas { display: block; }

#ui {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 24px; padding: 10px 28px;
  background: rgba(0,0,0,0.45); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.07); border-radius: 999px;
  color: rgba(255,255,255,0.55); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; z-index: 10; user-select: none;
}
.sg { display: flex; align-items: center; gap: 8px; }
.sg label { opacity: 0.5; }
input[type=range] {
  width: 90px; height: 2px; -webkit-appearance: none; appearance: none;
  background: rgba(255,255,255,0.15); outline: none; border-radius: 2px; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
  background: rgba(255,190,80,0.9); cursor: pointer;
  box-shadow: 0 0 8px rgba(255,160,40,0.7);
}
#hud {
  position: fixed; top: 16px; left: 18px;
  color: rgba(255,255,255,0.22); font-size: 10px; letter-spacing: 0.1em;
  pointer-events: none; text-transform: uppercase;
}
</style>
</head>
<body>
<div id="hud">Solstice Ocean &nbsp;·&nbsp; drag · scroll · sliders</div>
<div id="ui">
  <div class="sg"><label>Time</label><input type="range" id="slTime"  min="4"   max="22"  step="0.05" value="7.2"></div>
  <div class="sg"><label>Swell</label><input type="range" id="slSwell" min="0.1" max="2.5" step="0.05" value="1.0"></div>
  <div class="sg"><label>Bloom</label><input type="range" id="slBloom" min="0"   max="2"   step="0.05" value="0.7"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/objects/Sky.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
// ── renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── scene / camera ────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 20000);
camera.position.set(0, 7, 28);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 1, 0);
controls.maxPolarAngle = Math.PI * 0.488;
controls.minDistance = 3;
controls.maxDistance = 900;

// ── lights ────────────────────────────────────────────────────────────────────
const sunLight = new THREE.DirectionalLight(0xfff0cc, 5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near   =   1;
sunLight.shadow.camera.far    = 500;
sunLight.shadow.camera.left   = -80;
sunLight.shadow.camera.right  =  80;
sunLight.shadow.camera.top    =  80;
sunLight.shadow.camera.bottom = -80;
sunLight.shadow.bias          = -0.0005;
sunLight.shadow.normalBias    =  0.02;
sunLight.shadow.radius        =  10;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x8899ff, 0x002233, 0.4);
scene.add(hemiLight);

// ── sky ───────────────────────────────────────────────────────────────────────
const sky = new THREE.Sky();
sky.scale.setScalar(10000);
scene.add(sky);

const sunPos  = new THREE.Vector3();
const pmrem   = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envTex = null;

let waterMat = null;

function updateSky(hour) {
  const elevation = Math.sin((hour - 6) / 12 * Math.PI) * 85;
  const phi   = THREE.MathUtils.degToRad(90 - elevation);
  const theta = THREE.MathUtils.degToRad(180);
  sunPos.setFromSphericalCoords(1, phi, theta);

  const u = sky.material.uniforms;
  u.sunPosition.value.copy(sunPos);
  u.turbidity.value       = 7 + (1 - Math.max(0, elevation / 85)) * 6;
  u.rayleigh.value        = 1.5 + (1 - Math.max(0, elevation / 85)) * 0.8;
  u.mieCoefficient.value  = 0.005;
  u.mieDirectionalG.value = 0.85;

  if (envTex) envTex.dispose();
  envTex = pmrem.fromObject(sky).texture;
  scene.environment = envTex;

  const h = Math.max(0, elevation / 85);
  sunLight.position.copy(sunPos).multiplyScalar(250);
  sunLight.intensity = h * 6.5 + 0.08;
  const warm = 1 - Math.min(1, (1 - h) * 2.5);
  sunLight.color.setRGB(1.0, 0.82 + warm * 0.18, 0.55 + warm * 0.45);
  hemiLight.intensity = h * 0.5 + 0.08;
  hemiLight.color.setHSL(0.6, 0.6, h * 0.28 + 0.06);
  hemiLight.groundColor.setHSL(0.12, 0.4, h * 0.08 + 0.01);
  renderer.toneMappingExposure = 0.3 + h * 1.0;

  if (waterMat) {
    waterMat.uniforms.uSunDir.value.copy(sunPos);
    waterMat.uniforms.uSunColor.value.setRGB(sunLight.color.r, sunLight.color.g, sunLight.color.b);
    const hz = new THREE.Color().setHSL(0.08 + h * 0.5, 0.6, h * 0.4 + 0.15);
    const zn = new THREE.Color().setHSL(0.6, 0.7, h * 0.35 + 0.05);
    waterMat.uniforms.uSkyHorizon.value.copy(hz);
    waterMat.uniforms.uSkyZenith.value.copy(zn);
  }
}

// ── water shader ──────────────────────────────────────────────────────────────
const waterVert = `
precision highp float;
#define PI 3.14159265359

uniform float uTime;
uniform float uScale;

varying vec3  vWorld;
varying vec3  vNorm;
varying float vFoam;
varying float vHeight;

vec3 gerstner(vec2 pos, vec2 dir, float amp, float len, float Q, float t, inout vec3 n) {
  float k  = 2.0 * PI / len;
  float c  = sqrt(9.81 / k);
  vec2  d  = normalize(dir);
  float f  = k * (dot(d, pos) - c * t);
  float cf = cos(f), sf = sin(f);
  n.x -= d.x * k * amp * cf;
  n.z -= d.y * k * amp * cf;
  n.y -= Q   * k * amp * sf;
  return vec3(d.x * Q * amp * cf, amp * sf, d.y * Q * amp * cf);
}

void main() {
  vec3  p = position;
  vec3  n = vec3(0.0, 1.0, 0.0);
  float s = uScale;
  float t = uTime;

  p += gerstner(p.xz, vec2( 1.00,  0.20), 1.80*s, 90.0, 0.70, t,       n);
  p += gerstner(p.xz, vec2(-0.40,  1.00), 1.40*s, 70.0, 0.62, t,       n);
  p += gerstner(p.xz, vec2( 0.90,  0.70), 0.90*s, 40.0, 0.52, t*1.10, n);
  p += gerstner(p.xz, vec2(-0.70, -0.60), 0.70*s, 30.0, 0.46, t*0.92, n);
  p += gerstner(p.xz, vec2( 0.20,  1.00), 0.50*s, 22.0, 0.40, t*1.18, n);
  p += gerstner(p.xz, vec2(-1.00,  0.30), 0.28*s, 13.0, 0.32, t*1.30, n);
  p += gerstner(p.xz, vec2( 0.60, -0.80), 0.18*s,  8.0, 0.25, t*1.44, n);
  p += gerstner(p.xz, vec2(-0.30, -1.00), 0.12*s,  5.5, 0.20, t*1.55, n);
  p += gerstner(p.xz, vec2( 0.80,  0.10), 0.06*s,  3.0, 0.12, t*1.80, n);
  p += gerstner(p.xz, vec2(-0.50,  0.70), 0.04*s,  2.0, 0.10, t*2.00, n);

  float maxH = (1.8+1.4+0.9+0.7+0.5)*s;
  vFoam  = smoothstep(maxH * 0.58, maxH * 0.96, p.y);
  vHeight = p.y;
  vWorld = (modelMatrix * vec4(p, 1.0)).xyz;
  vNorm  = normalize(mat3(modelMatrix) * n);
  gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
}
`;

const waterFrag = `
precision highp float;
#define PI 3.14159265359

uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uSunDir;
uniform vec3  uSunColor;
uniform vec3  uSkyZenith;
uniform vec3  uSkyHorizon;

varying vec3  vWorld;
varying vec3  vNorm;
varying float vFoam;
varying float vHeight;

float beckmannD(float NdotH, float r) {
  float r2 = r * r;
  float n2 = NdotH * NdotH;
  return exp((n2 - 1.0) / max(r2 * n2, 1e-5)) / max(PI * r2 * n2 * n2, 1e-5);
}

vec3 skyApprox(vec3 R) {
  float up  = max(0.0, R.y);
  vec3  col = mix(uSkyHorizon, uSkyZenith, up * up);
  float sun  = pow(max(0.0, dot(R, uSunDir)), 800.0);
  float halo = pow(max(0.0, dot(R, uSunDir)),  28.0) * 0.12;
  col += uSunColor * (sun * 6.0 + halo);
  return col;
}

vec3 detailNormal(vec3 N, float t) {
  vec2 uv1 = vWorld.xz * 0.06 + vec2(t * 0.022,  t * 0.018);
  vec2 uv2 = vWorld.xz * 0.11 - vec2(t * 0.019, -t * 0.027);
  float n1x = sin(uv1.x * 6.1 + t * 0.4) * 0.04;
  float n1z = sin(uv1.y * 5.8 - t * 0.3) * 0.04;
  float n2x = sin(uv2.x * 9.3 - t * 0.6) * 0.025;
  float n2z = sin(uv2.y * 8.7 + t * 0.5) * 0.025;
  return normalize(N + vec3(n1x + n2x, 0.0, n1z + n2z));
}

void main() {
  vec3 N0 = normalize(vNorm);
  vec3 N  = detailNormal(N0, uTime);
  vec3 V  = normalize(uCamPos - vWorld);
  vec3 L  = normalize(uSunDir);
  vec3 H  = normalize(V + L);

  float NdotV = max(0.001, dot(N, V));
  float NdotL = max(0.000, dot(N, L));
  float NdotH = max(0.001, dot(N, H));
  float VdotH = max(0.001, dot(V, H));

  float F = 0.02 + 0.98 * pow(1.0 - NdotV, 5.0);

  vec3 R    = reflect(-V, N);
  vec3 refl = skyApprox(R);

  vec3 shallow = vec3(0.02, 0.20, 0.32);
  vec3 deep    = vec3(0.00, 0.05, 0.14);
  vec3 waterCol = mix(deep, shallow, smoothstep(-1.0, 3.0, vHeight));

  float D   = beckmannD(NdotH, 0.013);
  float G   = min(1.0, min(2.0 * NdotH * NdotV / VdotH, 2.0 * NdotH * NdotL / VdotH));
  float spec = (D * G * F) / (4.0 * NdotV * max(NdotL, 0.001));
  vec3 specCol = uSunColor * spec * NdotL * 4.0;

  float sssF = pow(max(0.0, dot(L, -N0)), 3.0);
  float sssB = pow(max(0.0, dot(V, -L)), 3.5);
  vec3  sss  = vec3(0.02, 0.38, 0.30) * (sssF * 0.45 + sssB * 0.18) * NdotL;

  vec3 col = mix(waterCol, refl, clamp(F * 0.9 + 0.08, 0.0, 1.0));
  col += specCol + sss;
  col = mix(col, vec3(0.88, 0.93, 1.0), vFoam * 0.65);

  float dist = length(vWorld.xz - uCamPos.xz);
  float haze = smoothstep(250.0, 1400.0, dist);
  col = mix(col, uSkyHorizon, haze * 0.45);

  float alpha = mix(0.72, 0.97, F + vFoam * 0.4);
  gl_FragColor = vec4(col, alpha);
}
`;

function buildOcean() {
  const geo = new THREE.PlaneGeometry(3000, 3000, 256, 256);
  geo.rotateX(-Math.PI / 2);

  waterMat = new THREE.ShaderMaterial({
    vertexShader:   waterVert,
    fragmentShader: waterFrag,
    uniforms: {
      uTime:       { value: 0 },
      uScale:      { value: 1 },
      uCamPos:     { value: new THREE.Vector3() },
      uSunDir:     { value: new THREE.Vector3(0, 1, 0) },
      uSunColor:   { value: new THREE.Color(1, 0.88, 0.65) },
      uSkyZenith:  { value: new THREE.Color(0.1, 0.25, 0.55) },
      uSkyHorizon: { value: new THREE.Color(0.6, 0.55, 0.45) },
    },
    transparent: true,
    side: THREE.FrontSide,
    depthWrite: false,
  });

  const mesh = new THREE.Mesh(geo, waterMat);
  mesh.receiveShadow = true;
  scene.add(mesh);
}

buildOcean();

// ── JS wave height (mirrors vertex shader for bobbing) ────────────────────────
function waveH(x, z, t) {
  const PI = Math.PI;
  const waves = [
    [[1.00, 0.20], 1.80, 90, 1.00],
    [[-0.40, 1.00], 1.40, 70, 1.00],
    [[0.90, 0.70],  0.90, 40, 1.10],
    [[-0.70,-0.60], 0.70, 30, 0.92],
    [[0.20, 1.00],  0.50, 22, 1.18],
  ];
  let y = 0;
  for (const [[dx, dz], amp, len, tm] of waves) {
    const k = 2 * PI / len;
    const c = Math.sqrt(9.81 / k);
    const dn = Math.hypot(dx, dz);
    const f = k * ((dx/dn) * x + (dz/dn) * z - c * t * tm);
    y += amp * Math.sin(f);
  }
  return y;
}

// ── PBR objects ───────────────────────────────────────────────────────────────
const floaters = [];

function addObj(geo, mat, px, pz, baseY) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  m.position.set(px, baseY, pz);
  m.userData.baseY = baseY;
  m.userData.px = px;
  m.userData.pz = pz;
  scene.add(m);
  floaters.push(m);
  return m;
}

const S64 = new THREE.SphereGeometry(1, 64, 64);

addObj(S64, new THREE.MeshPhysicalMaterial({
  color: 0xffd060, metalness: 1, roughness: 0.06, envMapIntensity: 2.5
}), -6, -2, 3.5);

addObj(S64, new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 1, roughness: 0.0, envMapIntensity: 3.2
}), -2, -5, 4.2);

addObj(S64, new THREE.MeshPhysicalMaterial({
  color: 0xb87030, metalness: 1, roughness: 0.18, envMapIntensity: 2.0
}), 3, -1, 3.0);

addObj(S64, new THREE.MeshPhysicalMaterial({
  color: 0xaadefc, metalness: 0, roughness: 0,
  transmission: 0.97, thickness: 2.2, ior: 1.52,
  envMapIntensity: 2.8, transparent: true
}), 7, -4, 4.0);

addObj(S64, new THREE.MeshPhysicalMaterial({
  color: 0x111122, metalness: 0.75, roughness: 0.32, envMapIntensity: 1.4
}), 6, 2, 3.2);

addObj(S64, new THREE.MeshPhysicalMaterial({
  color: 0x99aaff, metalness: 0.1, roughness: 0.02,
  iridescence: 1.0, iridescenceIOR: 1.3,
  iridescenceThicknessRange: [80, 420], envMapIntensity: 3.0
}), 0, -8, 5.0);

// torus knot
const torus = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.3, 0.38, 160, 32),
  new THREE.MeshPhysicalMaterial({ color: 0xffc830, metalness: 1, roughness: 0.04, envMapIntensity: 2.5 })
);
torus.castShadow = true;
torus.position.set(-4, 5, -8);
scene.add(torus);

// rocks
const rockMat = new THREE.MeshPhysicalMaterial({
  color: 0x252520, metalness: 0.05, roughness: 0.92, envMapIntensity: 0.4
});
[
  [[-18, -2, -24], [4, 5.5, 3.8]],
  [[-15, -1, -20], [2.5, 3, 2.4]],
  [[-21,-1.5,-26], [2, 2.8, 2]],
  [[-14, -1, -26], [1.5, 2, 1.6]],
].forEach(([pos, scl]) => {
  const r = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), rockMat);
  r.position.set(...pos);
  r.scale.set(...scl);
  r.castShadow = true;
  r.receiveShadow = true;
  scene.add(r);
});

// ── particles ─────────────────────────────────────────────────────────────────
const PC = 4000;
const pPos = new Float32Array(PC * 3);
const pVel = [];
const pLt  = new Float32Array(PC);
const pSd  = new Float32Array(PC);

for (let i = 0; i < PC; i++) {
  pSd[i] = Math.random();
  pLt[i] = Math.random();
  const r = Math.sqrt(Math.random()) * 70, a = Math.random() * Math.PI * 2;
  pPos[i*3]   = Math.cos(a) * r;
  pPos[i*3+1] = 0;
  pPos[i*3+2] = Math.sin(a) * r;
  pVel.push([(Math.random()-.5)*1.8, Math.random()*4+0.5, (Math.random()-.5)*1.8]);
}

const sprayGeo = new THREE.BufferGeometry();
const posAttr  = new THREE.BufferAttribute(pPos, 3);
sprayGeo.setAttribute('position', posAttr);
const sprayMat = new THREE.PointsMaterial({
  color: 0xbbd8ff, size: 0.15, transparent: true, opacity: 0.3,
  blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.Points(sprayGeo, sprayMat));

// ── post-processing ───────────────────────────────────────────────────────────
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));

const bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.55, 0.72
);
composer.addPass(bloomPass);

const finaleShader = {
  uniforms: {
    tDiffuse:  { value: null },
    uTime:     { value: 0 },
    uGrain:    { value: 0.038 },
    uVignette: { value: 0.55 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uGrain, uVignette;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main() {
      vec2  ctr = vUv - 0.5;
      float ca  = 0.0006;
      vec2  off = ctr * ca;
      float r   = texture2D(tDiffuse, vUv + off).r;
      float g   = texture2D(tDiffuse, vUv      ).g;
      float b   = texture2D(tDiffuse, vUv - off).b;
      vec3  col = vec3(r, g, b);
      float noise = (hash(vUv + fract(uTime * 0.013)) * 2.0 - 1.0) * uGrain;
      col += noise;
      float vig = 1.0 - smoothstep(0.28, 1.0, length(ctr) * 1.7) * uVignette;
      col *= vig;
      col = col + vec3(0.004, 0.002, 0.0) * (1.0 - col);
      gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);
    }
  `
};

const finalePass = new THREE.ShaderPass(finaleShader);
finalePass.renderToScreen = true;
composer.addPass(finalePass);

// ── resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ── UI ────────────────────────────────────────────────────────────────────────
document.getElementById('slTime').addEventListener('input',  e => updateSky(+e.target.value));
document.getElementById('slSwell').addEventListener('input', e => { if (waterMat) waterMat.uniforms.uScale.value = +e.target.value; });
document.getElementById('slBloom').addEventListener('input', e => { bloomPass.strength = +e.target.value; });

// ── animate ───────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let t = 0;

updateSky(7.2);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  controls.update();

  const wt = t * 0.5;
  if (waterMat) {
    waterMat.uniforms.uTime.value   = wt;
    waterMat.uniforms.uCamPos.value.copy(camera.position);
  }

  finalePass.uniforms.uTime.value = t;

  // bob spheres on waves
  const sc = waterMat ? waterMat.uniforms.uScale.value : 1;
  floaters.forEach((m, i) => {
    const h = waveH(m.userData.px, m.userData.pz, wt) * sc;
    m.position.y += (h + m.userData.baseY - m.position.y) * 0.08;
    m.rotation.y += dt * (0.08 + i * 0.015) * (i % 2 ? 1 : -1);
    m.rotation.x += dt * 0.04 * (i % 3 ? 1 : -1);
  });

  torus.rotation.x += dt * 0.22;
  torus.rotation.y += dt * 0.16;
  torus.position.y = 5 + Math.sin(t * 0.4) * 0.6;

  // spray
  for (let i = 0; i < PC; i++) {
    pLt[i] += dt * (0.45 + pSd[i] * 0.55);
    if (pLt[i] > 1) {
      pLt[i] = 0;
      const r2 = Math.sqrt(Math.random()) * 55, a2 = Math.random() * Math.PI * 2;
      posAttr.setXYZ(i, Math.cos(a2) * r2, 0, Math.sin(a2) * r2);
      pVel[i] = [(Math.random()-.5)*1.8, (Math.random()*3.5+0.5)*sc, (Math.random()-.5)*1.8];
    }
    const lt = pLt[i];
    posAttr.setX(i, posAttr.getX(i) + pVel[i][0] * dt);
    posAttr.setY(i, posAttr.getY(i) + pVel[i][1] * dt - 4.5 * lt * lt * dt);
    posAttr.setZ(i, posAttr.getZ(i) + pVel[i][2] * dt);
  }
  posAttr.needsUpdate = true;
  sprayMat.opacity = 0.15 + Math.min(sc * 0.1, 0.3);

  composer.render();
}

animate();
</script>
</body>
