<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Illustrated portrait of Victor Hale, a fictional tour operator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd9df"/><stop offset=".55" stop-color="#9fb2bd"/><stop offset="1" stop-color="#5d7383"/></linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="45%"><stop offset="0" stop-color="#fff6dd" stop-opacity=".9"/><stop offset="1" stop-color="#fff6dd" stop-opacity="0"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2a57c"/><stop offset="1" stop-color="#b9774f"/></linearGradient>
    <linearGradient id="fleece" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4466"/><stop offset="1" stop-color="#1a2840"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e1dc"/><stop offset="1" stop-color="#8f8b85"/></linearGradient>
    <pattern id="stub" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.500" cy="1.500" r=".9" fill="#6b5a4d" opacity=".55"/><circle cx="3.800" cy="3.600" r=".8" fill="#9a8e84" opacity=".55"/></pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/><rect width="400" height="400" fill="url(#sun)"/>
  <!-- car park hints -->
  <rect x="0" y="250" width="400" height="150" fill="#4b5a63" opacity=".35"/>
  <rect x="20" y="226" width="90" height="34" rx="10" fill="#e9ecef" opacity=".55"/><rect x="300" y="232" width="100" height="30" rx="10" fill="#8c2f2f" opacity=".4"/>
  <circle cx="40" cy="262" r="9" fill="#2a2f33" opacity=".5"/><circle cx="92" cy="262" r="9" fill="#2a2f33" opacity=".5"/>
