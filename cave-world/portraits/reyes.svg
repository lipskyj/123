<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Illustrated portrait of Dr. Ama Reyes, a fictional field geologist">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#3f6f63"/><stop offset=".55" stop-color="#1d3a33"/><stop offset="1" stop-color="#0b1613"/></radialGradient>
    <radialGradient id="light" cx="50%" cy="30%" r="50%"><stop offset="0" stop-color="#e9f6d8" stop-opacity=".45"/><stop offset="1" stop-color="#e9f6d8" stop-opacity="0"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5638"/><stop offset="1" stop-color="#5e3622"/></linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f08a2c"/><stop offset="1" stop-color="#b9561a"/></linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e3e6e3"/><stop offset="1" stop-color="#a9b0ad"/></linearGradient>
    <pattern id="curls" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.500" cy="4.500" r="3.200" fill="#3a3330"/><circle cx="2" cy="2" r="1.500" fill="#8f8a86"/><circle cx="7" cy="6.500" r="1.300" fill="#a39e99"/></pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="200" cy="120" rx="190" ry="150" fill="url(#light)"/>
  <!-- rock texture -->
  <path d="M0 70 C60 40 90 90 140 60 S240 30 290 70 S370 40 400 60 V0 H0Z" fill="#0d1e1a" opacity=".55"/>
  <path d="M0 300 C30 260 60 280 70 240 L60 400 H0Z M400 280 C370 250 350 270 335 235 L340 400 H400Z" fill="#0d1e1a" opacity=".5"/>
  <!-- shoulders / jacket -->
  <path d="M60 400 C62 330 105 300 160 288 L240 288 C295 300 338 330 340 400Z" fill="url(#jacket)"/>
  <path d="M160 288 L200 352 L240 288 L226 282 L200 318 L174 282Z" fill="#7a3a12" opacity=".55"/>
  <path d="M168 286 L200 336 L232 286 L222 300 L200 326 L178 300Z" fill="#2c3b38"/>
  <path d="M120 312 L152 300 L170 344 L140 360Z" fill="#ffa24a" opacity=".5"/>
  <rect x="198" y="336" width="4" height="64" fill="#5a2a0e" opacity=".6"/>
  <!-- reflective strip -->
  <path d="M78 372 C120 360 150 362 170 370 L168 384 C148 376 118 375 76 388Z" fill="#dfe6e0" opacity=".85"/>
  <path d="M322 372 C280 360 250 362 230 370 L232 384 C252 376 282 375 324 388Z" fill="#dfe6e0" opacity=".85"/>
  <!-- radio on collar -->
  <rect x="244" y="292" width="30" height="46" rx="5" fill="#23282a"/><rect x="249" y="298" width="20" height="12" rx="2" fill="#5fe0b5" opacity=".85"/>
  <circle cx="254" cy="322" r="2.500" fill="#596163"/><circle cx="264" cy="322" r="2.500" fill="#596163"/><rect x="266" y="270" width="4" height="24" rx="2" fill="#23282a"/>
  <!-- neck -->
  <path d="M172 240 L228 240 L232 292 C214 306 186 306 168 292Z" fill="#5e3622"/>
  <path d="M172 262 C190 276 210 276 228 262 L229 280 C210 292 190 292 171 280Z" fill="#4a2a1a" opacity=".6"/>
  <!-- hair at sides and back -->
  <path d="M118 168 C110 120 140 92 200 90 C260 92 290 120 282 168 C286 190 278 214 270 224 L130 224 C122 214 114 190 118 168Z" fill="url(#curls)"/>
  <!-- ears -->
  <ellipse cx="124" cy="190" rx="13" ry="20" fill="#6e4129"/><ellipse cx="276" cy="190" rx="13" ry="20" fill="#6e4129"/>
  <circle cx="124" cy="210" r="3.500" fill="#d9b45a"/><circle cx="276" cy="210" r="3.500" fill="#d9b45a"/>
  <!-- face -->
  <path d="M132 160 C132 112 162 98 200 98 C238 98 268 112 268 160 C268 214 242 256 200 258 C158 256 132 214 132 160Z" fill="url(#skin)"/>
  <path d="M240 120 C262 140 266 190 248 226 C258 196 256 152 240 120Z" fill="#4a2a1a" opacity=".35"/>
  <ellipse cx="165" cy="200" rx="15" ry="9" fill="#a85a3c" opacity=".35"/><ellipse cx="236" cy="200" rx="15" ry="9" fill="#a85a3c" opacity=".35"/>
  <!-- eyebrows -->
  <path d="M150 158 C160 150 176 150 186 156" stroke="#2a1d17" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M214 156 C224 150 240 150 250 158" stroke="#2a1d17" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <path d="M152 176 C160 166 178 166 186 176 C178 183 160 183 152 176Z" fill="#f3ead8"/>
  <path d="M214 176 C222 166 240 166 248 176 C240 183 222 183 214 176Z" fill="#f3ead8"/>
  <circle cx="169" cy="175" r="6.500" fill="#3b2216"/><circle cx="231" cy="175" r="6.500" fill="#3b2216"/>
  <circle cx="169" cy="175" r="3" fill="#120a06"/><circle cx="231" cy="175" r="3" fill="#120a06"/>
  <circle cx="171.500" cy="172.500" r="2" fill="#fff"/><circle cx="233.500" cy="172.500" r="2" fill="#fff"/>
  <path d="M150 176 C160 164 178 164 188 175" stroke="#1d120c" stroke-width="2.500" fill="none"/><path d="M212 175 C222 164 240 164 250 176" stroke="#1d120c" stroke-width="2.500" fill="none"/>
  <path d="M188 182 C192 186 194 186 196 186 M248 182 C252 186 254 186 256 186" stroke="#4a2a1a" stroke-width="1.500" fill="none" opacity=".7"/>
  <!-- laugh lines -->
  <path d="M146 182 C142 186 142 190 145 193 M254 182 C258 186 258 190 255 193" stroke="#4a2a1a" stroke-width="1.600" fill="none" opacity=".6"/>
  <!-- nose -->
  <path d="M200 180 C198 196 192 206 188 212 C194 218 206 218 212 212 C208 206 202 196 200 180Z" fill="#6b3d27" opacity=".55"/>
  <path d="M188 212 C192 216 196 216 198 214 M212 212 C208 216 204 216 202 214" stroke="#3b2216" stroke-width="2.200" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M172 228 C186 244 214 244 228 228 C216 236 184 236 172 228Z" fill="#fff4ea"/>
  <path d="M170 226 C184 248 216 248 230 226" stroke="#4d2018" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M180 240 C192 248 208 248 220 240" stroke="#7d3528" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M166 222 C162 226 162 230 165 232 M234 222 C238 226 238 230 235 232" stroke="#4a2a1a" stroke-width="1.800" fill="none" opacity=".7"/>
  <!-- helmet -->
  <path d="M116 150 C112 80 156 46 200 46 C244 46 288 80 284 150Z" fill="url(#helmet)"/>
  <path d="M100 150 C140 136 260 136 300 150 C300 160 292 166 280 164 C240 156 160 156 120 164 C108 166 100 160 100 150Z" fill="#c9cecb"/>
  <path d="M200 48 C196 70 196 110 200 140" stroke="#b7bdb9" stroke-width="10" fill="none"/>
  <path d="M150 64 C140 82 134 104 134 130" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".8"/>
  <!-- headlamp -->
  <rect x="176" y="96" width="48" height="34" rx="8" fill="#3a4246"/><circle cx="200" cy="113" r="12" fill="#d9e4e0"/><circle cx="200" cy="113" r="8" fill="#fffbe6"/><circle cx="196" cy="109" r="3" fill="#fff"/>
  <path d="M124 128 C150 118 174 116 176 116 M276 128 C250 118 226 116 224 116" stroke="#1f2427" stroke-width="6" fill="none"/>
  <!-- chin strap -->
  <path d="M122 162 C124 214 148 248 178 262 M278 162 C276 214 252 248 222 262" stroke="#1f2427" stroke-width="4" fill="none" opacity=".85"/>
  <!-- grime -->
  <ellipse cx="248" cy="148" rx="6" ry="3" fill="#3b2a1d" opacity=".35"/><ellipse cx="150" cy="232" rx="5" ry="2.500" fill="#3b2a1d" opacity=".25"/>
</svg>
